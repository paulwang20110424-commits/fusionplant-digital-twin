name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version consistency
        run: npm run version:check

      - name: Documentation assets
        run: npm run check:assets

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build size report
        run: npm run stats

      - name: Upload build artefact
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            .smoke/build-stats.json
          retention-days: 7

  e2e:
    name: Browser audit (Chromium/Chrome)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview:ci > /tmp/preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:5174/; then
              echo "preview server is up"
              break
            fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:5174/ || (cat /tmp/preview.log && exit 1)

      - name: Interaction audit (1600x950)
        run: npm run audit

      - name: Interaction audit (1024x768)
        run: npm run audit:tablet

      - name: Accessibility audit
        run: npm run test:a11y

      - name: Upload audit artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-artefacts
          path: |
            .smoke/
            /tmp/preview.log
          retention-days: 7
          if-no-files-found: warn

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/preview.log || true
