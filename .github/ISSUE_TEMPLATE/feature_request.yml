name: Feature request
description: Suggest a model, a diagnostic or a UI capability.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Plasma physics model
        - Magnetic / coil model
        - Heating model
        - Thermal / cooling model
        - Power balance
        - 3D visualisation
        - Charts / diagnostics
        - Simulation lab / scenarios
        - History / export
        - Performance
        - Documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: If this is a physics change, describe the equation and its units.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request keeps the project clearly labelled as a simulation.
          required: true
        - label: This request does not require a secret key in client-side code.
          required: true
